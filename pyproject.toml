[project]
name = "rent-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedikt Stranak", email = "benedikt.stranak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
    "uk-address-matcher>=1.4.0",
]

[project.scripts]
build-dataset = "rent_project.pipelines.build_dataset:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pyyaml>=6.0.3",
]
